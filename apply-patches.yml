name: Apply Mati-Metsi Patches
on: workflow_dispatch # This allows you to trigger the action manually

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow the action to push commits
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the patch script
        run: python patch.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automatically apply Step 3 Supabase patches"
          file_pattern: 'Mati-Metsi fixed.patched.html'
