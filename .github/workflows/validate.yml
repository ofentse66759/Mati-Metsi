name: HTML5 Validation

on:
  push:
    branches: [ "main" ] # or your default branch
  pull_request:
    branches: [ "main" ]

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Run the HTML5 validator
      - name: Validate HTML5
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          # The 'ignore' option is for files/directories, not error strings.
          # For specific error message suppression, it is best to use a config file.
          # If you just want to ignore a specific folder (e.g., 'node_modules'), use:
          # ignore: |
          #   node_modules
