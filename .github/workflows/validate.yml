name: Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          # Tell the validator to ignore SPA-related structural "errors"
          ignore-re: |
            A document must not include more than one visible "main" element
            Element "style" not allowed as child of element "body" in this context
            Element "h1" not allowed as child of element "span" in this context
            Element "h1" not allowed as child of element "button" in this context
            The "aria-labelledby" attribute must point to an element in the same document
